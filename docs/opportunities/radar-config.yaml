schema_version: 2

radar:
  mode: independent-dual-round-robin
  discovery_mode: workflow-simulation-first
  selection_axes: [segment, technical-focus]
  segment_cursor: independent-round-robin
  technical_focus_cursor: independent-round-robin
  advance_both_cursors_after_every_completed_run: true
  technical_focus_guides_simulation_not_solution: true
  opportunities_per_run: 1
  allow_no_new_fit: true
  minimum_fit_to_publish: 55
  minimum_sources: 1
  minimum_workflow_simulations_before_no_new_fit: 3
  implementation_issue_creation: disabled
  return_to_first_segment_after_cycle: true
  return_to_first_technical_focus_after_cycle: true

technical_focus_rotation:
  required: true
  state_source: radar-state.yaml
  method_source: technical-focus-rotation.md
  independent_from_segment_cursor: true
  reject_forced_algorithm_selection: true
  allow_focus_rejection: true
  allow_no_compatible_process: true
  focuses:
    - id: classical-supervised-ml
      process_signals: [repeated-observations, known-outcomes, prediction-time-features, operational-labels]
      candidate_model_families: [linear-models, decision-trees, random-forests, gradient-boosting, calibrated-classifiers]
    - id: anomaly-and-unsupervised-learning
      process_signals: [rare-deviations, weak-labels, peer-groups, operating-envelope, review-corrections]
      candidate_model_families: [clustering, isolation-methods, one-class-models, density-estimation, autoencoders, graph-anomaly-detection]
    - id: time-series-and-sequence-models
      process_signals: [temporal-order, windows, delayed-outcomes, degradation, seasonality, state-transitions]
      candidate_model_families: [statistical-forecasting, gradient-boosting-with-temporal-features, lstm, gru, temporal-convolution, state-space-models, temporal-transformer]
    - id: specialized-neural-networks
      process_signals: [image, video, audio, waveform, graph, spatial, multimodal-structure]
      candidate_model_families: [cnn, vision-transformer, graph-neural-network, autoencoder, multimodal-encoder, domain-specific-neural-network]
    - id: small-language-models-and-nlp
      process_signals: [bounded-text-classification, extraction, matching, routing, latency, privacy, cost]
      candidate_model_families: [compact-encoder, sentence-transformer, small-generative-model, fine-tuned-classifier, token-classifier, domain-extractor]
    - id: conversational-llm-and-rag
      process_signals: [conversational-task, grounded-retrieval, source-attribution, document-synthesis, interactive-clarification]
      candidate_model_families: [pretrained-llm, embedding-model, reranker, retrieval-pipeline, grounded-response-model]
    - id: llm-agents-and-tool-use
      process_signals: [multi-step-goal, tools, permissions, changing-state, checkpoints, bounded-planning]
      candidate_model_families: [tool-using-llm, constrained-planner-executor, deterministic-workflow-with-model-routing, policy-governed-agent]
    - id: recommendation-and-ranking
      process_signals: [candidate-set, eligibility, ordering-decision, observed-choice, observable-outcome]
      candidate_model_families: [learning-to-rank, matrix-factorization, two-tower-retrieval, candidate-generation-and-reranking, calibrated-recommender]
    - id: causal-and-uplift-learning
      process_signals: [intervention-alternatives, treatment-assignment, confounding, outcome, policy-question]
      candidate_model_families: [uplift-tree, causal-forest, doubly-robust-estimation, propensity-method, heterogeneous-treatment-effect-model]
    - id: bandits-and-reinforcement-learning
      process_signals: [repeated-decision, alternative-actions, state, reward, delayed-effect, exploration-constraint, offline-or-simulated-evaluation]
      candidate_model_families: [multi-armed-bandit, contextual-bandit, offline-rl, constrained-rl, simulation-trained-policy]
    - id: forecasting-and-optimization
      process_signals: [future-demand-or-capacity, constraints, objective-function, feasible-actions, planning-decision]
      candidate_model_families: [probabilistic-forecasting, mathematical-optimization, constraint-programming, simulation-optimization, learned-forecast-with-deterministic-solver]

coverage_targets:
  role: investigation-guidance-not-publication-quota
  tracking_window: complete-technical-focus-cycle
  custom_training_minimum_share: 0.35
  pretrained_or_rag_maximum_share: 0.45
  experimental_rl_or_causal_minimum_per_cycle: 1
  no_new_fit_allowed: true
  never_manufacture_opportunity_to_meet_target: true

operational_simulation:
  required: true
  run_before_broad_web_research: true
  require_candidate_generation_before_solution_search: true
  organization_archetype_required: true
  actor_role_required: true
  bounded_process_required: true
  require_current_technical_focus_scan: true
  technical_focus_selects_process_signals_not_algorithm: true
  technical_focus_may_be_rejected: true
  required_scenarios:
    - normal-flow
    - exception-flow
    - peak-or-degraded-flow
  required_trace_fields:
    - trigger
    - expected-outcome
    - actors-and-handoffs
    - inputs-and-systems
    - information-available-at-each-step
    - decisions-and-judgment
    - uncertainty-and-missing-context
    - queues-waiting-rework-and-reconciliation
    - failure-or-loss-consequence
    - feedback-label-reward-or-correction-signal
  allow_explicit_operational_assumptions: true
  allow_synthetic_events_and_cases: true
  require_assumptions_to_be_labeled: true
  require_deterministic_alternative_test: true
  require_statistical_and_simpler_model_baseline_when_relevant: true
  require_ai_candidate_to_map_to_specific_decision_exception_or_uncertainty: true
  research_validates_simulation_not_replaces_it: true
  do_not_require_source_for_every_simulated_microstep: true

market_context:
  default_primary_market: Brazil
  default_jurisdiction: Brazil
  current_date_from_runtime: true
  search_languages: [pt-BR, en]
  require_brazil_problem_evidence: true
  require_current_brazil_regulatory_context_for_regulated_segments: true
  minimum_brazilian_load_bearing_sources: 1
  current_evidence_window_months: 18
  foreign_sources_role: secondary-comparison-and-technical-support
  older_sources_role: historical-or-stable-background-only
  reject_foreign_only_problem_evidence: true
  reject_imported_foreign_legal_assumptions: true

research:
  required: true
  role: validate-context-regulation-plausibility-data-counterevidence-and-novelty
  run_after_initial_operational_simulation: true
  require_current_web_research: true
  source_priority:
    - brazilian-regulators-public-institutions-and-official-statistics
    - brazilian-industry-associations-operational-reports-public-tenders-and-local-cases
    - official-platform-product-api-release-and-roadmap-documentation
    - current-commercial-sector-and-open-source-solution-documentation
    - operational-guides-incident-reports-and-process-documentation
    - current-international-regulators-standards-and-technical-research
    - academic-and-technical-research
    - reputable-reporting
  reject_marketing_only_problem_evidence: true
  allow_vendor_or_case_evidence_for_solution_plausibility_when_labeled: true
  record_queries: true
  record_sources: true
  distinguish_simulated_observation_fact_inference_and_unknown: true
  require_counter_evidence_search: true
  counter_evidence_is_design_input_not_default_rejection: true
  absence_of_production_evidence_is_not_rejection: true
  absence_of_brazilian_solution_validation_is_not_rejection: true

existing_solution_landscape:
  required: true
  role: novelty-and-positioning-guardrail
  run_after_candidate_generation: true
  require_current_official_platform_search: true
  require_current_product_and_vendor_search: true
  require_public_roadmap_and_release_note_review_when_available: true
  require_open_source_search_when_relevant: true
  require_api_and_integration_documentation_review_when_available: true
  required_disposition: [build, extend, integrate, adopt, no-new-fit]
  require_actor_process_capability_integration_authority_outcome_comparison: true
  require_material_uncovered_gap: true
  require_differentiation_statement: true
  reject_new_solution_framing_when_core_solution_exists: true
  cloud_model_vendor_ui_or_architecture_change_is_not_differentiation: true
  generic_agent_rag_clustering_dashboard_or_ranking_is_not_differentiation: true
  roadmap_capability_counts_as_existing_landscape: true
  adoption_is_valid_no_new_fit_outcome: true

intelligence_requirement:
  required: true
  allowed_ai_dependency: [supporting, core]
  forbidden_ai_dependency: [none, optional]
  allowed_capability_families:
    - machine-learning-training
    - fine-tuning
    - generative-ai
    - agents-and-tool-use
    - retrieval-augmented-generation
    - speech-recognition-and-synthesis
    - computer-vision
    - document-recognition-and-extraction
    - classification-and-entity-extraction
    - anomaly-detection
    - prediction-and-forecasting
    - recommendation-and-ranking
    - optimization-and-reinforcement-learning
    - multimodal-models
    - other-explicit-model-based-capability
  require_process_stage_and_decision_mapping: true
  require_business_necessity: true
  require_inputs_and_outputs: true
  require_training_grounding_inference_or_optimization_assumptions: true
  require_evaluation_plan: true
  require_deterministic_or_human_fallback: true
  require_explicit_ai_role_map: true
  forbid_decorative_ai: true

technical_classification:
  required_for_new_opportunities: true
  required_when_existing_opportunity_is_materially_revalidated: true
  speculative_bulk_backfill_forbidden: true
  template: opportunity-technical-classification-template.md
  required_fields:
    - technical_focus
    - technical_class
    - model_strategy
    - candidate_model_families
    - learning_paradigm
    - data_modalities
    - interaction_pattern
    - training_requirement
    - data_readiness
  allowed_model_strategy:
    - custom-trained
    - fine-tuned
    - pretrained
    - rag-grounded
    - simulation-trained
    - optimization-with-learned-components
    - rules-plus-model
    - hybrid
  allowed_learning_paradigm:
    - supervised
    - unsupervised
    - self-supervised
    - semi-supervised
    - contextual-bandit
    - reinforcement-learning
    - causal-inference
    - no-custom-training
    - hybrid
  allowed_training_requirement: [required, optional, not-required]
  allowed_data_readiness:
    - ready
    - viable-with-data-work
    - pilot-data-needed
    - not-currently-trainable
    - knowledge-base-required
    - not-applicable

training_data_analysis:
  required_when_model_strategy: [custom-trained, fine-tuned]
  required_when_training_requirement: required
  required_primary_mechanisms:
    - classical-supervised-ml
    - specialized-neural-networks
    - time-series-and-sequence-models
    - recommendation-and-ranking
    - causal-and-uplift-learning
    - bandits-and-reinforcement-learning
    - learned-forecasting
  required_fields:
    - observation_unit
    - input_data
    - target_or_reward
    - label_source
    - prediction_time
    - expected_volume
    - class_balance
    - historical_coverage
    - train_validation_split
    - leakage_risks
    - representativeness_risks
    - feedback_loop
    - privacy_and_usage_constraints
    - fallback_if_data_is_insufficient
  distinguish_confirmed_assumed_and_unknown: true
  invent_dataset_properties: forbidden
  trainable_readiness_values: [ready, viable-with-data-work, pilot-data-needed, not-currently-trainable]
  fine_tuning_requires_comparison_against: [prompting, rag, pretrained-inference, compact-supervised-model, conventional-training]

publication:
  default_new_status: hypothesis
  base_template: opportunity-template.md
  technical_classification_template: opportunity-technical-classification-template.md
  require_operational_simulation_section: true
  require_normal_exception_and_peak_or_degraded_scenarios: true
  require_simulated_observations_and_assumptions: true
  require_specific_actor: true
  require_specific_process: true
  require_primary_market_and_jurisdiction: true
  require_brazil_applicability_section: true
  require_recent_brazilian_problem_evidence: true
  require_existing_solutions_and_differentiation_section: true
  require_build_extend_or_integrate_disposition_for_active_opportunity: true
  require_material_uncovered_gap: true
  require_existing_product_and_non_ai_baselines: true
  require_data_feedback_and_simulation_assumptions: true
  require_technical_classification: true
  require_conditional_training_data_analysis: true
  require_bounded_prototype_scope: true
  require_model_workflow_business_adoption_and_safety_metrics: true
  require_failure_redesign_and_scale_criteria: true
  require_macro_mermaid_architecture: true
  require_material_intelligent_capability: true
  require_fit_breakdown: true
  require_duplicate_keys: true
  forbid_unsubstantiated_percentages: true
  production_evidence_required: false
  brazilian_solution_case_required: false
  proven_roi_required: false
  completed_integration_required: false

solution_evidence_levels: [conceptual, prototype, pilot, production, repeated-production]
operational_maturity_levels: [unvalidated, early, proven]

confidence_rules:
  low: simulation-derived differentiated hypothesis with major unknowns
  medium: differentiated hypothesis supported by current problem and technical evidence
  high: supported by credible comparable production evidence and realistic data readiness

fit_guardrails:
  technical_feasibility_means_prototype_testability: true
  process_opportunity_fit_must_come_from_simulation: true
  minimum_technical_feasibility_to_publish: 8
  deterministic_baseline_is_comparison_not_rejection: true
  unresolved_unknowns_reduce_confidence_not_automatic_fit: true
  not_currently_trainable_rejects_or_redesigns_training_hypothesis: true
  core_existing_solution_overlap_without_material_gap_max_strategic_differentiation: 4
  core_existing_solution_overlap_without_material_gap_max_total_fit: 54
  core_mechanism_invalidated_without_mitigation_max_technical_feasibility: 7
  core_mechanism_invalidated_without_mitigation_max_total_fit: 54

valid_no_new_fit_reasons:
  - no-current-brazilian-problem-evidence-after-simulation
  - duplicate-of-existing-repository-opportunity
  - duplicate-of-current-official-commercial-sector-or-open-source-solution
  - existing-platform-adoption-or-configuration-is-sufficient
  - deterministic-process-or-software-improvement-is-sufficient
  - no-material-uncovered-gap
  - decorative-or-unnecessary-ai
  - no-focus-compatible-process-after-simulation
  - no-plausible-data-model-integration-feedback-simulation-or-prototype-path
  - insufficient-data-path-for-selected-technical-hypothesis
  - central-mechanism-invalidated-without-credible-mitigation
  - generic-candidate-cannot-be-narrowed

invalid_no_new_fit_reasons:
  - external-research-did-not-suggest-an-idea
  - no-brazilian-production-deployment
  - no-local-false-positive-rate
  - roi-not-yet-proven
  - labels-integration-cost-or-adoption-still-unknown
  - deterministic-baseline-exists
  - prototype-still-required
  - technical-focus-was-not-the-most-obvious-ai

fit_dimensions:
  - {id: process-opportunity-fit, max_score: 20}
  - {id: business-value, max_score: 20}
  - {id: technical-feasibility, max_score: 20}
  - {id: reuse-potential, max_score: 20}
  - {id: strategic-differentiation, max_score: 20}

segments:
  - {id: cross-industry, name: Cross-industry and shared operations, enabled: true}
  - {id: human-resources, name: Human resources and people operations, enabled: true}
  - {id: financial-services, name: Banking insurance payments and financial services, enabled: true}
  - {id: healthcare, name: Healthcare clinics hospitals and life sciences, enabled: true}
  - {id: retail-ecommerce, name: Retail commerce and consumer services, enabled: true}
  - {id: manufacturing, name: Manufacturing and industrial operations, enabled: true}
  - {id: logistics-transport, name: Logistics transport warehousing and mobility, enabled: true}
  - {id: agriculture, name: Agriculture livestock and agribusiness, enabled: true}
  - {id: construction-real-estate, name: Construction engineering and real estate, enabled: true}
  - {id: energy-utilities, name: Energy utilities water and environmental services, enabled: true}
  - {id: telecommunications, name: Telecommunications and network operations, enabled: true}
  - {id: education, name: Education training and workforce development, enabled: true}
  - {id: public-sector, name: Public sector and citizen services, enabled: true}
  - {id: professional-services, name: Legal accounting consulting and professional services, enabled: true}
  - {id: hospitality-tourism, name: Hospitality tourism food service and events, enabled: true}
  - {id: media-entertainment, name: Media entertainment sports and creative industries, enabled: true}
