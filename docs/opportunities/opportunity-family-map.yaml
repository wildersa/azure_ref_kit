- opportunity_id: CROSS-001
  document: segments/cross-industry/CROSS-001-offboarding-control-plane.md
  family_id: FAMILY-008
  family_name: Calibrated case-risk triage for bounded human intervention
  disposition: candidate-variant
  fingerprint:
    actor: Offboarding coordinator or security analyst
    bounded_process: Close a leaver or mover case across digital access, physical access, assets, and evidence
    trigger: Authoritative employment termination, contractor end, or role-change event
    primary_decision: Which residual-access or incomplete-control findings require investigation while mandatory tasks are completed
    material_outcome: Reduce residual access and incomplete offboarding controls with auditable completion evidence
    input_modalities:
    - structured records
    - identity and access graph
    - tickets
    - connector outcomes
    - asset and badge records
    - activity signals
    primary_intelligent_mechanism: Identity/access graph anomaly detection and residual-control risk ranking
    execution_model: durable asynchronous case orchestration
    deterministic_controls:
    - required task policy
    - deadlines
    - approvals
    - legal holds
    - connector authorization
    - segregation of duties
    human_authority: Security, HR, manager, and control owners approve findings, waivers, and consequential actions
    integration_shape: Stateful control plane with read/write connectors plus a ranked investigation queue
    feedback_and_evaluation: Confirmed or dismissed residual findings, connector results, reopened cases, and post-offboarding discoveries
  reused_architecture: Canonical case snapshot, deterministic policy gates, graph-derived risk scoring, confidence/abstention, human review, and
    adjudicated feedback.
  case_specific_adapters: HR/contractor events; identity, SaaS, badge, device, asset, ITSM, and SCIM connectors; role and legal-hold rules.
  case_specific_extension: Durable policy-derived task orchestration, evidence ledger, connector write actions, and a long-lived identity/access
    graph.
  why_no_separate_architecture_yet: The risk-scoring and review core is comparable, but durable write-oriented orchestration is structurally larger
    and is queued for derivation review instead of being absorbed into the advisory base.
  validation_delta: Use a separate prototype track because runtime, authority, or learning metrics are not fully comparable with the base.
  derivation_signal: Durable multi-system task orchestration and governed write actions.
