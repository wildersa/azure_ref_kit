  name: Observed-state conformance and corrective work prioritization
  status: active
  document: solution-families/FAMILY-006-observed-state-conformance-corrective-prioritization.md
  reusable_outcome: Turn field or operational observations into evidence-backed deviation cases and prioritized corrective work without automating
    certification, payment, or safety approval.
