  name: Calibrated case-risk triage for bounded human intervention
  status: active
  document: solution-families/FAMILY-008-calibrated-case-risk-triage.md
  reusable_outcome: Focus limited human review or support capacity on bounded cases most likely to benefit from timely intervention while preserving
    deterministic eligibility and human authority.
