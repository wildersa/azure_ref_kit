name: Temporary solution consolidation

on:
  push:
    branches:
      - solution-opportunity-full-consolidation-20260725
    paths:
      - scripts/.temp_solution_consolidation.part5
      - .github/workflows/temp-solution-consolidation.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: solution-opportunity-full-consolidation-20260725
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML validator
        run: python -m pip install PyYAML

      - name: Rebuild and execute consolidation
        shell: bash
        run: |
          cat scripts/.temp_solution_consolidation.part{1,2,3,4,5} | base64 --decode | gzip --decompress > scripts/temp_solution_consolidation.py
          python scripts/temp_solution_consolidation.py
          rm -f scripts/.temp_solution_consolidation.part{1,2,3,4,5}

      - name: Commit validated catalog
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(opportunities): consolidate solution families'
          git push origin HEAD:solution-opportunity-full-consolidation-20260725
